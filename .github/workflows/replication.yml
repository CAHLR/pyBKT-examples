name: Replication check

# Reruns every example script against pyBKT's master branch and compares the
# results with expected.json, weekly and on pull requests. GitHub pauses the
# schedule after 60 days without a commit, so it also runs by hand. It uses the
# C++ build only: the pure Python build took about 27 minutes for KtPps.py alone.
on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replicate:
    name: pyBKT master, C++ build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The checkout must not be named pyBKT: the scripts run from the repo
      # root, where a pyBKT folder would shadow the installed package.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: CAHLR/pyBKT
          ref: master
          path: pybkt-source
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install numpy pandas requests setuptools

      - name: Install pyBKT with the C++ extension
        env:
          PYBKT_REQUIRE_CPP: "1"
        run: |
          python -m pip install --no-build-isolation ./pybkt-source
          python -c "import pyBKT.fit.E_step"

      - name: Run the example scripts
        env:
          OMP_NUM_THREADS: "1"
        run: |
          mkdir -p logs
          for script in BasicForgets KtIdem KtPps ItemOrderEffect ItemLearningEffect; do
            echo "::group::$script"
            start=$SECONDS
            python "$script.py" > "logs/$script.txt" 2>&1 || echo "$script exited with an error"
            tail -n 20 "logs/$script.txt"
            echo "$script took $((SECONDS - start)) s"
            echo "::endgroup::"
          done

      - name: Compare with expected.json
        run: |
          status=0
          python compare.py > comparison.md || status=$?
          cat comparison.md >> "$GITHUB_STEP_SUMMARY"
          cat comparison.md
          exit "$status"
